version: '3.1'

services:
  mysql:
    image: mysql:latest
    container_name: mysql-database
    environment:
      MYSQL_ROOT_PASSWORD: mypassword
      # MYSQL_DATABASE: mydatabase
      # MYSQL_USER: root
      # MYSQL_PASSWORD: cookiebusiness
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
    driver: local